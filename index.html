<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Finca El Dorado</title>
  <link rel="icon" href="img/logo.svg">
  <link rel="stylesheet" href="css/styles.css?v=14">
  <!-- Aplica el tema guardado antes de pintar, para evitar parpadeo -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('finca-tema');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <section id="pantalla-login" class="login-wrap">
    <form id="form-login" class="login-card">
      <div class="login-logo logo"></div>
      <p class="login-sub">Administración de la finca</p>
      <input type="email" id="login-email" placeholder="Correo" autocomplete="username" required>
      <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password" required>
      <button type="submit" id="btn-login">Entrar</button>
      <p id="login-error" class="login-error"></p>
    </form>
  </section>

  <!-- ===================== APP ===================== -->
  <div id="app" class="app oculto">

    <!-- ----- SIDEBAR ----- -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="brand-logo logo"></div>
      </div>

      <nav class="menu">
        <button class="menu-item activo" data-vista="inicio"><span class="ic">🏠</span><span class="tx">Inicio</span></button>
        <button class="menu-item" data-vista="ventas"><span class="ic">🚚</span><span class="tx">Despachado</span></button>
        <button class="menu-item" data-vista="cotizador"><span class="ic">🧮</span><span class="tx">Cuentas / Factura</span></button>
        <button class="menu-item" data-vista="compras"><span class="ic">📦</span><span class="tx">Compras</span></button>
        <button class="menu-item" data-vista="pagos"><span class="ic">💳</span><span class="tx">Pagos</span></button>
        <button class="menu-item" data-vista="registros"><span class="ic">📒</span><span class="tx">Registros</span></button>
        <button class="menu-item" data-vista="resultados"><span class="ic">📊</span><span class="tx">Resultados</span></button>
        <button class="menu-item" data-vista="configuracion"><span class="ic">⚙️</span><span class="tx">Configuración</span></button>
        <button class="menu-item" data-vista="perfil"><span class="ic">👤</span><span class="tx">Perfil</span></button>
      </nav>

      <div id="sidebar-equipo" class="sidebar-equipo"></div>

      <button id="btn-colapsar" class="sidebar-colapsar" type="button" title="Recoger menú">‹ Colapsar</button>
    </aside>

    <!-- Fondo oscuro para cerrar el menu en celular -->
    <div class="backdrop" id="backdrop"></div>

    <!-- ----- ZONA PRINCIPAL ----- -->
    <div class="principal">
      <header class="topbar">
        <button class="hamburguesa" id="btn-menu" title="Menú">☰</button>
        <h1 class="topbar-title" id="topbar-title">Inicio</h1>
        <div class="topbar-acciones">
          <button id="btn-tema" class="btn-icono" title="Cambiar tema">🌙</button>
          <span class="topbar-user" id="topbar-user"></span>
          <button id="btn-logout" class="btn-salir" title="Salir">Salir</button>
        </div>
      </header>

      <main class="contenido">
        <section id="vista-inicio"        class="vista"></section>
        <section id="vista-ventas"        class="vista oculto"></section>
        <section id="vista-cotizador"     class="vista oculto"></section>
        <section id="vista-compras"       class="vista oculto"></section>
        <section id="vista-pagos"         class="vista oculto"></section>
        <section id="vista-registros"     class="vista oculto"></section>
        <section id="vista-resultados"    class="vista oculto"></section>
        <section id="vista-configuracion" class="vista oculto"></section>
        <section id="vista-perfil"        class="vista oculto"></section>
      </main>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/app.js?v=3" defer></script>
  <script src="js/ventas.js?v=17" defer></script>
  <script src="js/cotizador.js?v=15" defer></script>
  <script src="js/configuracion.js?v=3" defer></script>
  <script src="js/inicio.js?v=2" defer></script>
  <script src="js/registros.js?v=4" defer></script>
  <script src="js/aportes.js" defer></script>
  <script src="js/egresos.js?v=4" defer></script>
  <script src="js/ingresos.js" defer></script>
  <script src="js/resultados.js?v=4" defer></script>
  <script src="js/perfil.js" defer></script>
</body>
</html>
